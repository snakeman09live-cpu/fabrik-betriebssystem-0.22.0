[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabrik-betriebssystem"
version = "0.22.0"
description = "Referenzimplementierung des Fabrik-Betriebssystems"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.5",
  "sqlalchemy>=2.0",
  "redis>=5.0",
  "psycopg[binary]>=3.1"
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

# Ohne diese Angabe scheitert die automatische Paketerkennung von setuptools,
# weil neben dem Paket weitere Top-Level-Verzeichnisse (tests, migrations,
# schemas) und Module (generate_schemas.py) im Projektstamm liegen.
[tool.setuptools]
packages = ["fabrik_betriebssystem"]

[project.scripts]
fabrik-api = "fabrik_betriebssystem.servicestart:start_api"
fabrik-worker = "fabrik_betriebssystem.servicestart:start_worker"
fabrik-ablaufplaner = "fabrik_betriebssystem.servicestart:start_scheduler"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
